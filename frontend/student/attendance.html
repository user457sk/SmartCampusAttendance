<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance History – SmartCampus</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/student.css" />
</head>
<body data-page="attendance">
<div class="app">

    <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="logo">🎓</span> Smart<span>Campus</span></div>
        <nav>
            <a href="dashboard.html"><span class="ico">🏠</span> Dashboard</a>
            <a href="enroll.html"><span class="ico">📝</span> Subject Enrollment</a>
            <a href="attendance.html"><span class="ico">📅</span> Attendance History</a>
        </nav>
        <div class="logout"><button onclick="logout()">⎋ Logout</button></div>
    </aside>

    <div class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:14px">
                <button class="hamburger" onclick="toggleSidebar()">☰</button>
                <h2>Attendance History</h2>
            </div>
            <div class="user-chip"><span class="avatar">S</span> <span id="userName">student</span></div>
        </div>

        <div class="content">
            <div class="panel" style="margin-top:0">
                <div class="panel-head">
                    <h3>My Attendance History</h3>
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                        <select class="form-control" id="attendanceHistoryView" aria-label="Filter attendance history">
                            <option value="subject">By Subject</option>
                            <option value="date">By Date</option>
                        </select>
                        <select class="form-control" id="attendanceHistorySubject" aria-label="Select subject" style="width:auto;min-width:200px">
                            <option value="">Choose a subject</option>
                        </select>
                        <input class="form-control" type="date" id="attendanceHistoryDate" aria-label="Select attendance date" style="display:none" />
                        <button class="btn btn-primary" id="attendanceHistorySearch">Apply Filter</button>
                    </div>
                </div>
                <div class="table-wrap" style="border:none;border-radius:0">
                    <table>
                        <thead>
                            <tr><th>Date</th><th>Subject</th><th>Code</th><th>Status</th></tr>
                        </thead>
                        <tbody id="recordsBody">
                            <tr><td colspan="4" class="muted">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;padding:12px">
                    <button class="btn btn-ghost btn-sm attendance-export" data-format="excel">Download Excel</button>
                    <button class="btn btn-ghost btn-sm attendance-export" data-format="pdf">Download PDF</button>
                    <button class="btn btn-ghost btn-sm attendance-export" data-format="csv">Download CSV</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/script.js"></script>
<script src="../js/attendance-export.js"></script>
<script src="../js/student.js"></script>
</body>
</html>
